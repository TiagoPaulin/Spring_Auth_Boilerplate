version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: springauth-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: springauth-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
  backend-api:
    build: .
    container_name: springauth-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - RESET_PASSWORD_URL=${RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
    depends_on:
      postgres-db:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  postgres_data: