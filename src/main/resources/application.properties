spring.application.name=springauth

spring.output.ansi.enabled=ALWAYS

ALWAYSspring.profiles.active=test 
spring.jpa.open-in-view=true 

spring.datasource.url=jdbc:h2:mem:springauth
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

api.security.token.secret=${JWT_SECRET:my-secret-key}
api.security.token.expiration=4
api.security.refresh.expiration=7

api.admin.name=${ADMIN_NAME:admin}
api.admin.email=${ADMIN_EMAIL:admin@system.com}
api.admin.password=${ADMIN_PASSWORD:admin}