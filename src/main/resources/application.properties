spring.application.name=springauth

spring.output.ansi.enabled=ALWAYS

spring.profiles.active=test 
spring.jpa.open-in-view=true 

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=4
api.security.refresh.expiration=7
api.security.reset-password.expiration=10

api.admin.name=${ADMIN_NAME}
api.admin.email=${ADMIN_EMAIL}
api.admin.password=${ADMIN_PASSWORD}